name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rootfs:
    # Provision the Linux guest on real ARM64 hardware, without QEMU.
    # Defaults to GitHub's standard ARM64 runner. To use a configured
    # larger ARM runner, set repository variable MICROOS_ARM_RUNNER to its label.
    runs-on: ${{ vars.MICROOS_ARM_RUNNER || 'ubuntu-24.04-arm' }}
    env:
      # Require a 14 GiB ARM64 runner by default; override only for a known larger-runner label.
      MICROOS_MIN_RAM_GIB: ${{ vars.MICROOS_MIN_RAM_GIB || '14' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install zstd compressor
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Verify native ARM64 runner and memory budget
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          echo "Runner architecture: $(uname -m)"
          echo "Runner CPUs: $(nproc)"
          free -h
          MEM_KB="$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
          echo "ARM64 runner memory: $((MEM_KB / 1024)) MiB"
          if [ "$MICROOS_MIN_RAM_GIB" != "0" ]; then
            MIN_MEM_KB="$((MICROOS_MIN_RAM_GIB * 1024 * 1024))"
            if [ "$MEM_KB" -lt "$MIN_MEM_KB" ]; then
              echo "Configured runner requires at least ${MICROOS_MIN_RAM_GIB} GiB RAM."
              exit 1
            fi
          fi
          docker info >/dev/null
          docker pull --platform linux/arm64 ubuntu:24.04

      # Native ARM64 Chromium and the X11/noVNC stack are smoke-tested in the rootfs.
      - name: Build the fully provisioned ARM64 rootfs
        run: |
          bash -n tool/prebake_rootfs.sh
          bash -n tool/setup.sh
          grep -q 'start-browser.sh' tool/setup.sh
          grep -q 'start-desktop.sh' tool/setup.sh
          chmod +x tool/prebake_rootfs.sh
          ./tool/prebake_rootfs.sh
          ROOTFS="assets/rootfs/rootfs.tar.zst"
          test -s "$ROOTFS"
          zstd -t "$ROOTFS"
          zstd -dc "$ROOTFS" | tar -tf - > /tmp/rootfs-archive.list
          grep -qxE '(\./)?root/\.microos/ready' /tmp/rootfs-archive.list
          grep -qxE '(\./)?root/\.microos/image-version' /tmp/rootfs-archive.list
          grep -qxE '(\./)?usr/bin/chromium' /tmp/rootfs-archive.list
          grep -qxE '(\./)?usr/lib/chromium/chromium' /tmp/rootfs-archive.list
          grep -qxE '(\./)?usr/local/bin/start-browser.sh' /tmp/rootfs-archive.list
          grep -qxE '(\./)?root/.microos/start-desktop.sh' /tmp/rootfs-archive.list
          grep -qxE '(\./)?opt/firefox/firefox' /tmp/rootfs-archive.list
          grep -qxE '(\./)?opt/firefox/firefox-bin' /tmp/rootfs-archive.list
          grep -qxE '(\./)?usr/local/bin/microos-browse' /tmp/rootfs-archive.list
          grep -qxE '(\./)?usr/local/bin/microos-jar' /tmp/rootfs-archive.list
          grep -qxE '(\./)?root/.opencode/bin/opencode' /tmp/rootfs-archive.list
          grep -q 'home/microos-browser' /tmp/rootfs-archive.list
          grep -qxE '(\./)?usr/bin/qbittorrent-nox' /tmp/rootfs-archive.list
          grep -qxE '(\./)?root/.microos/start-torrent.sh' /tmp/rootfs-archive.list
          echo "Pre-baked rootfs:"
          ls -lh "$ROOTFS"
          sha256sum "$ROOTFS"

      - name: Upload pre-baked ARM64 rootfs
        uses: actions/upload-artifact@v4
        with:
          name: MicroOS-rootfs-arm64
          path: assets/rootfs/rootfs.tar.zst
          if-no-files-found: error
          retention-days: 2

  apk:
    # Flutter's Android SDK build runs on x64; output remains arm64-v8a.
    runs-on: ubuntu-24.04
    needs: rootfs
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install zstd verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      # Remove large preinstalled SDKs before setting up Java/Flutter/NDK.
      # Toolchains needed by this job are installed again below.
      - name: Free Disk Space (Ubuntu)
        run: |
          set -euxo pipefail
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          if [ -n "${AGENT_TOOLSDIRECTORY:-}" ]; then
            sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          fi
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "Disk space after cleanup:"
          df -h /

      - name: Download native-built ARM64 rootfs
        uses: actions/download-artifact@v4
        with:
          name: MicroOS-rootfs-arm64
          path: assets/rootfs

      - name: Verify transferred rootfs
        run: |
          test -s assets/rootfs/rootfs.tar.zst
          zstd -t assets/rootfs/rootfs.tar.zst
          zstd -dc assets/rootfs/rootfs.tar.zst | tar -tf - > /tmp/rootfs-archive.list
          grep -qxE '(\./)?root/\.microos/ready' /tmp/rootfs-archive.list
          grep -qxE '(\./)?root/\.microos/image-version' /tmp/rootfs-archive.list
          grep -qxE '(\./)?opt/firefox/firefox' /tmp/rootfs-archive.list
          grep -qxE '(\./)?opt/firefox/firefox-bin' /tmp/rootfs-archive.list
          grep -qxE '(\./)?usr/local/bin/microos-browse' /tmp/rootfs-archive.list
          grep -qxE '(\./)?usr/local/bin/microos-jar' /tmp/rootfs-archive.list
          grep -qxE '(\./)?root/.opencode/bin/opencode' /tmp/rootfs-archive.list
          grep -q 'home/microos-browser' /tmp/rootfs-archive.list
          ls -lh assets/rootfs/rootfs.tar.zst
          sha256sum assets/rootfs/rootfs.tar.zst

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          architecture: x64
          cache: true

      - name: Fetch Android proot runtime
        run: |
          chmod +x tool/fetch_runtime.sh tool/bootstrap_android.sh
          ./tool/fetch_runtime.sh

      - name: Scaffold and patch the Android project
        run: ./tool/bootstrap_android.sh

      - name: Install NDK (native PTY plugin)
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;28.2.13676358" >/dev/null

      - name: Fetch bundled JetBrains Mono fonts
        run: |
          chmod +x tool/fetch_fonts.sh
          ./tool/fetch_fonts.sh

      - name: Fetch ThanasOS wallpapers
        run: |
          chmod +x tool/fetch_thanasos_wallpapers.sh
          ./tool/fetch_thanasos_wallpapers.sh

      - name: Dependencies
        run: flutter pub get

      - name: Generate premium adaptive launcher icon
        run: |
          python3 -m pip install --quiet --user Pillow
          python3 tool/generate_launcher_icon.py
          dart run flutter_launcher_icons

      - name: Align plugin compileSdk (AAR metadata)
        run: |
          chmod +x tool/patch_plugins.sh
          ./tool/patch_plugins.sh 36

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK contains the pre-baked rootfs and ARM64 runtime
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/"
          ROOTFS_BYTES="$(unzip -l "$APK" | awk '$4 == "assets/flutter_assets/assets/rootfs/rootfs.tar.zst" {print $1}')"
          if [ -z "$ROOTFS_BYTES" ] || [ "$ROOTFS_BYTES" -lt 1048576 ]; then
            echo "ERROR: bundled rootfs asset is missing or unexpectedly small (bytes: ${ROOTFS_BYTES:-0})"
            exit 1
          fi
          echo "Bundled rootfs asset: $ROOTFS_BYTES bytes"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Stage artifact
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk \
             "out/MicroOS-${GITHUB_RUN_NUMBER}-arm64.apk"
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MicroOS-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to a release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: MicroOS APK build ${{ github.run_number }}
          body: |
            MicroOS ${{ github.sha }}
            Debug-signed release APK for arm64-v8a (sideload only).
            Includes the pre-baked Ubuntu 24.04 ARM64 rootfs and proot runtime.
          files: out/*.apk
          make_latest: true
