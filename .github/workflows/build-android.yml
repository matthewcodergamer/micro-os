name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    # Build and provision the guest on real ARM64 hardware; no QEMU emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch Android proot runtime
        run: |
          chmod +x tool/fetch_runtime.sh tool/bootstrap_android.sh tool/prebake_rootfs.sh
          ./tool/fetch_runtime.sh

      - name: Verify native ARM64 runner
        run: |
          test "$(uname -m)" = "aarch64"
          docker info >/dev/null
          docker pull --platform linux/arm64 ubuntu:24.04

      - name: Build the fully provisioned ARM64 rootfs
        run: |
          ./tool/prebake_rootfs.sh
          ROOTFS="assets/rootfs/rootfs.tar.gz"
          test -s "$ROOTFS"
          tar -tzf "$ROOTFS" | grep -qxE '(\./)?root/\.microos/ready'
          tar -tzf "$ROOTFS" | grep -qxE '(\./)?opt/firefox/firefox'
          echo "Pre-baked rootfs:"
          ls -lh "$ROOTFS"
          sha256sum "$ROOTFS"

      - name: Scaffold and patch the Android project
        run: ./tool/bootstrap_android.sh

      - name: Install NDK (native PTY plugin)
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;28.2.13676358" >/dev/null

      - name: Fetch bundled JetBrains Mono fonts
        run: |
          chmod +x tool/fetch_fonts.sh
          ./tool/fetch_fonts.sh

      - name: Dependencies
        run: flutter pub get

      - name: Generate premium adaptive launcher icon
        run: |
          python3 -m pip install --quiet --user Pillow
          python3 tool/generate_launcher_icon.py
          dart run flutter_launcher_icons

      - name: Align plugin compileSdk (AAR metadata)
        run: |
          chmod +x tool/patch_plugins.sh
          ./tool/patch_plugins.sh 36

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK contains the pre-baked rootfs and ARM64 runtime
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/"
          ROOTFS_BYTES="$(unzip -l "$APK" | awk '$4 == "assets/flutter_assets/assets/rootfs/rootfs.tar.gz" {print $1}')"
          if [ -z "$ROOTFS_BYTES" ] || [ "$ROOTFS_BYTES" -lt 1048576 ]; then
            echo "ERROR: bundled rootfs asset is missing or unexpectedly small (bytes: ${ROOTFS_BYTES:-0})"
            exit 1
          fi
          echo "Bundled rootfs asset: $ROOTFS_BYTES bytes"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Stage artifact
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk \
             "out/MicroOS-${GITHUB_RUN_NUMBER}-arm64.apk"
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MicroOS-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to a release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: MicroOS APK build ${{ github.run_number }}
          body: |
            MicroOS ${{ github.sha }}
            Debug-signed release APK for arm64-v8a (sideload only).
            Includes the pre-baked Ubuntu 24.04 ARM64 rootfs and proot runtime.
          files: out/*.apk
          make_latest: true
