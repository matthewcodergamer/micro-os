name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prebake-rootfs:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Pre-bake Ubuntu ARM64 rootfs and Firefox natively
        run: |
          chmod +x tool/prebake_rootfs.sh
          ./tool/prebake_rootfs.sh

      - name: Upload prepared ARM64 rootfs
        uses: actions/upload-artifact@v4
        with:
          name: microos-prebaked-rootfs
          path: assets/rootfs/rootfs.tar.gz
          if-no-files-found: error
          retention-days: 1

  apk:
    needs: prebake-rootfs
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Download prepared ARM64 rootfs
        uses: actions/download-artifact@v4
        with:
          name: microos-prebaked-rootfs
          path: assets/rootfs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Bundle Linux runtime (rootfs + proot)
        run: |
          chmod +x tool/fetch_runtime.sh tool/bootstrap_android.sh
          ./tool/fetch_runtime.sh

      - name: Scaffold and patch the Android project
        run: ./tool/bootstrap_android.sh

      - name: Install NDK (native PTY plugin)
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;28.2.13676358" >/dev/null

      - name: Dependencies
        run: flutter pub get

      - name: Generate premium adaptive launcher icon
        run: |
          python3 -m pip install --quiet --user Pillow
          python3 tool/generate_launcher_icon.py
          dart run flutter_launcher_icons

      - name: Align plugin compileSdk (AAR metadata)
        run: |
          chmod +x tool/patch_plugins.sh
          ./tool/patch_plugins.sh 36

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Stage artifact
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk \
             "out/MicroOS-${GITHUB_RUN_NUMBER}-arm64.apk"
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MicroOS-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to a release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: MicroOS APK build ${{ github.run_number }}
          body: |
            MicroOS ${{ github.sha }}
            Debug-signed release APK for arm64-v8a (sideload only).
            Bundles an Ubuntu 24.04 arm64 rootfs, proot and first-boot provisioning.
          files: out/*.apk
          make_latest: true
