# The approved Play Store artwork is the only icon source.
# tool/generate_launcher_icon.py derives the legacy and adaptive layers from
# playstore-icon-512.png; never point these at generated or generic art.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/misty_icon.png"
  min_sdk_android: 26
  adaptive_icon_background: "assets/icon/misty_background.png"
  adaptive_icon_foreground: "assets/icon/misty_foreground.png"
  adaptive_icon_foreground_inset: 0
