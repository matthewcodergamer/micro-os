name: micro_os
description: "MicroOS - a native mobile Linux workstation with a macOS-style window manager."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_pty: ^0.4.2
  xterm: ^4.0.0
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  battery_plus: ^6.0.2
  connectivity_plus: ^6.0.5
  device_info_plus: ^10.1.2
  permission_handler: ^11.3.1
  webview_flutter: ^4.9.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    # The guest provisioning script is bundled verbatim so the app can install
    # it into the rootfs on first boot.
    - tool/setup.sh
    - assets/rootfs/
    - assets/proot/
    - assets/fonts/OFL.txt
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
